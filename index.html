<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portfolio GIS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio GIS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #050505;
    --card: #111111;
    --border: #262626;
    --text: #f5f5f4;
    --muted: #9a9a94;
    --accent: #cf9d4f;
    --accent-soft: rgba(207,157,79,0.14);
    --red: #e2665a;
  }
  html { background: #050505; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 14px;
    padding-top: calc(14px + env(safe-area-inset-top));
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
    padding-left: calc(14px + env(safe-area-inset-left));
    padding-right: calc(14px + env(safe-area-inset-right));
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .serif { font-family: 'Playfair Display', Georgia, serif; }
  header { margin-bottom: 16px; }
  .header-top-row { position: relative; height: 42px; margin-bottom: 8px; }
  h1 {
    font-size: 1.5rem;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  h1 .accent-word { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 0.82rem; margin-top: 3px; }
  .back-btn {
    position: absolute; left: 0; top: 0;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-weight: 600;
  }

  /* ---- Category filter chips ---- */
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  .filter-chip {
    flex: 0 0 auto; background: var(--card); border: 1px solid var(--border);
    color: var(--muted); border-radius: 20px; padding: 7px 14px; font-size: 0.78rem; font-weight: 600;
  }
  .filter-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* ---- Masonry grid ---- */
  .masonry { column-count: 2; column-gap: 10px; }
  @media (min-width: 480px) { .masonry { column-count: 2; } }
  .tile {
    break-inside: avoid; margin-bottom: 10px; border-radius: 14px; overflow: hidden;
    position: relative; background: var(--card); border: 1px solid var(--border);
  }
  .tile img { width: 100%; display: block; }
  .tile-noimg { aspect-ratio: 4/5; display:flex; align-items:center; justify-content:center; color: var(--muted); font-size: 0.75rem; padding: 16px; text-align:center; }
  .tile-overlay {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 12px 10px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,0.9));
  }
  .tile-title { font-size: 0.95rem; font-weight: 700; line-height: 1.25; }
  .tile-cat { font-size: 0.68rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 3px; }
  .empty-state { text-align: center; color: var(--muted); padding: 70px 20px; font-size: 0.9rem; }

  /* ---- FAB ---- */
  .fab {
    position: fixed; right: calc(20px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--accent); color: #000; font-size: 1.8rem; font-weight: 700;
    border: none; box-shadow: 0 8px 24px rgba(207,157,79,0.35);
    display: flex; align-items: center; justify-content: center; line-height: 0;
  }

  /* ---- Case study (project detail) ---- */
  .case-hero { margin: -14px -14px 0 -14px; }
  .case-hero img { width: 100%; display: block; max-height: 46vh; object-fit: cover; }
  .case-hero-noimg { width: 100%; aspect-ratio: 16/9; background: var(--card); display:flex; align-items:center; justify-content:center; color: var(--muted); }
  .case-body { padding-top: 18px; }
  .case-cat { color: var(--accent); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
  .case-title { font-size: 1.6rem; font-weight: 800; margin: 6px 0 4px 0; line-height: 1.2; }
  .case-date { color: var(--muted); font-size: 0.8rem; margin-bottom: 16px; }
  .case-desc { font-size: 0.98rem; line-height: 1.7; color: #e3e3df; white-space: pre-wrap; margin-bottom: 18px; }
  .tech-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 22px; }
  .tech-chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 5px 12px; font-size: 0.72rem; color: var(--muted); font-weight: 600;
  }
  .case-section-title { font-size: 1.05rem; font-weight: 700; margin: 26px 0 12px 0; }
  .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gallery-grid img { width: 100%; border-radius: 10px; display: block; aspect-ratio: 1/1; object-fit: cover; }
  .map-embed-wrap {
    border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--card);
  }
  .map-embed-wrap iframe { width: 100%; height: 420px; border: none; display: block; }
  .pdf-btn {
    display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.88rem;
  }
  .edit-row { display: flex; gap: 10px; margin-top: 30px; }
  .edit-row button { flex: 1; }

  /* ---- Form view ---- */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field input, .field textarea {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 11px 12px; border-radius: 10px; font-size: 0.9rem;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 90px; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .upload-box {
    border: 1.5px dashed var(--border); border-radius: 14px; padding: 20px; text-align: center;
    color: var(--muted); font-size: 0.82rem; cursor: pointer;
  }
  .upload-preview { width: 100%; border-radius: 12px; margin-top: 10px; display: block; }
  .gallery-preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .gallery-preview-grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; }
  .gallery-thumb-wrap { position: relative; }
  .gallery-thumb-remove {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,0.75); color: #fff; border: none; font-size: 0.7rem; line-height: 1;
  }
  .primary-btn {
    width: 100%; background: var(--accent); color: #000; border: none; font-weight: 800;
    padding: 13px; border-radius: 12px; font-size: 0.95rem; margin-top: 6px;
  }
  .secondary-btn {
    width: 100%; background: transparent; color: var(--text); border: 1px solid var(--border);
    padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-top: 10px; font-weight: 600;
  }
  .danger-btn {
    width: 100%; background: transparent; color: var(--red); border: 1px solid var(--red);
    padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-top: 10px; font-weight: 700;
  }

  #toast {
    position: fixed; left: 50%; top: -80px; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--accent);
    color: var(--accent); font-weight: 700; font-size: 0.9rem; padding: 12px 22px;
    border-radius: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 999;
    transition: top 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.35s ease; opacity: 0; pointer-events: none;
  }
  #toast.show { top: 16px; opacity: 1; }
  .info-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; font-size: 0.85rem; color: var(--muted); line-height: 1.5;
  }
</style>
</head>
<body>

<div id="toast">✅ <span id="toastText">Guardado</span></div>

<header id="mainHeader">
  <div class="header-top-row">
    <button class="back-btn" id="backBtn" style="display:none;">‹ Volver</button>
    <button class="back-btn" id="adminBtn" style="position:absolute; right:0; left:auto;"></button>
  </div>
  <h1 class="serif" id="pageTitle">Portfolio <span class="accent-word">GIS</span></h1>
  <div class="subtitle" id="subtitleLabel">Tus proyectos de análisis espacial</div>
</header>

<div id="app"></div>

<button class="fab" id="fabBtn">+</button>

<script>
/* =========================================================
   BASE DE DATOS PÚBLICA (Supabase) — lectura abierta,
   escritura protegida por tu código de administrador
   ========================================================= */
// 👉 PEGA AQUÍ tu URL y tu clave pública de Supabase (Settings → API)
const SUPABASE_URL = "https://iyopjzyzgtcrtflvxfne.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_C22bTdhZqsjA2ElynKG3Ug_n7z6XhPP";

let supabaseClient = null;
try {
  if (window.supabase && SUPABASE_URL.startsWith("http")) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) { console.error("Supabase no configurado todavía", e); }

const ADMIN_CODE_KEY = "portfoliogis:admincode";
function getAdminCode() { return localStorage.getItem(ADMIN_CODE_KEY) || ""; }
function isAdmin() { return !!getAdminCode(); }

async function tryUnlockAdmin() {
  if (!supabaseClient) { showToast("⚠️ Base de datos no configurada todavía"); return; }
  const code = window.prompt("Introduce tu código de administrador:");
  if (!code) return;
  try {
    const { data, error } = await supabaseClient.rpc('admin_verify_passcode', { p_passcode: code });
    if (error) throw error;
    if (data === true) {
      localStorage.setItem(ADMIN_CODE_KEY, code);
      showToast("🔓 Modo edición activado en este dispositivo");
      render();
    } else {
      showToast("⚠️ Código incorrecto");
    }
  } catch (e) {
    console.error(e);
    showToast("⚠️ No se pudo comprobar el código");
  }
}
function lockAdmin() {
  localStorage.removeItem(ADMIN_CODE_KEY);
  showToast("🔒 Edición desactivada en este dispositivo");
  render();
}

/* =========================================================
   ESTADO PERSISTENTE
   ========================================================= */
const PROJECTS_CACHE_KEY = "portfoliogis:cache";

function loadProjectsCache() {
  try {
    const raw = localStorage.getItem(PROJECTS_CACHE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveProjectsCache(list) {
  try { localStorage.setItem(PROJECTS_CACHE_KEY, JSON.stringify(list)); } catch (e) { /* cache best-effort */ }
}

let projectsMemory = loadProjectsCache();
function loadProjects() { return projectsMemory; }

async function fetchProjectsFromCloud() {
  if (!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient.from('portfolio_projects').select('data').order('updated_at', { ascending: false });
    if (error) throw error;
    projectsMemory = (data || []).map(row => row.data);
    saveProjectsCache(projectsMemory);
    if (currentView === "home") render();
  } catch (e) {
    console.error("No se pudieron cargar los proyectos:", e);
  }
}

async function saveProjectToCloud(record) {
  if (!supabaseClient) { showToast("⚠️ Base de datos no configurada"); return false; }
  try {
    const { error } = await supabaseClient.rpc('admin_save_project', { p_passcode: getAdminCode(), p_project: record });
    if (error) throw error;
    return true;
  } catch (e) {
    console.error(e);
    showToast("⚠️ No se pudo guardar (revisa tu código o conexión)");
    return false;
  }
}
async function deleteProjectFromCloud(id) {
  if (!supabaseClient) return false;
  try {
    const { error } = await supabaseClient.rpc('admin_delete_project', { p_passcode: getAdminCode(), p_id: id });
    if (error) throw error;
    return true;
  } catch (e) {
    console.error(e);
    showToast("⚠️ No se pudo eliminar (revisa tu código o conexión)");
    return false;
  }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || "";
  return div.innerHTML;
}
function escapeAttr(str) { return (str || "").replace(/"/g, "&quot;"); }
function toEmbedUrl(url) {
  // Convierte enlaces de Google Drive de "ver" a "preview" embebible
  const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if (driveMatch) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
  return url;
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  clearTimeout(toastTimer);
  t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
let currentView = "home"; // home | form | detail
let editingId = null;
let viewingId = null;
let activeFilter = "todas";

document.getElementById('backBtn').addEventListener('click', () => {
  currentView = "home"; render();
});
document.getElementById('adminBtn').addEventListener('click', () => {
  if (isAdmin()) { lockAdmin(); } else { tryUnlockAdmin(); }
});
document.getElementById('fabBtn').addEventListener('click', () => {
  editingId = null; currentView = "form"; render();
});

function render() {
  const backBtn = document.getElementById('backBtn');
  const adminBtn = document.getElementById('adminBtn');
  const title = document.getElementById('pageTitle');
  const subtitle = document.getElementById('subtitleLabel');
  const app = document.getElementById('app');
  const fab = document.getElementById('fabBtn');
  const heroActive = currentView === "detail";

  document.getElementById('mainHeader').style.display = heroActive ? "none" : "block";
  backBtn.style.display = currentView === "home" ? "none" : "block";
  fab.style.display = (currentView === "home" && isAdmin()) ? "flex" : "none";
  adminBtn.style.display = currentView === "home" ? "block" : "none";
  adminBtn.textContent = isAdmin() ? "🔓 Edición" : "🔒";

  if (currentView === "home") {
    title.innerHTML = `Portfolio <span class="accent-word">GIS</span>`;
    subtitle.textContent = "Tus proyectos de análisis espacial";
    renderHome(app);
    return;
  }
  if (currentView === "form") {
    title.textContent = editingId ? "Editar proyecto" : "Nuevo proyecto";
    subtitle.textContent = "";
    renderForm(app);
    return;
  }
  if (currentView === "detail") {
    renderDetail(app);
    return;
  }
}

/* =========================================================
   HOME — mosaico tipo Behance
   ========================================================= */
function renderHome(app) {
  const projects = loadProjects();
  const categories = Array.from(new Set(projects.map(p => p.category).filter(Boolean)));

  let filterHtml = `<div class="filter-row">`;
  filterHtml += `<button class="filter-chip ${activeFilter === 'todas' ? 'active' : ''}" data-filter="todas">Todas</button>`;
  categories.forEach(c => {
    filterHtml += `<button class="filter-chip ${activeFilter === c ? 'active' : ''}" data-filter="${escapeAttr(c)}">${escapeHtml(c)}</button>`;
  });
  filterHtml += `</div>`;

  const filtered = activeFilter === "todas" ? projects : projects.filter(p => p.category === activeFilter);
  const sorted = filtered.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  let gridHtml;
  if (sorted.length === 0) {
    gridHtml = `<div class="empty-state">${projects.length === 0 ? "Aún no has añadido ningún proyecto.<br>Toca el botón + para empezar tu portfolio." : "No hay proyectos en esta categoría."}</div>`;
  } else {
    gridHtml = `<div class="masonry">`;
    sorted.forEach(p => {
      const img = p.cover;
      gridHtml += `
        <div class="tile" data-id="${p.id}">
          ${img ? `<img src="${img}" alt="">` : `<div class="tile-noimg">${escapeHtml(p.title)}</div>`}
          <div class="tile-overlay">
            <div class="tile-title">${escapeHtml(p.title)}</div>
            ${p.category ? `<div class="tile-cat">${escapeHtml(p.category)}</div>` : ""}
          </div>
        </div>
      `;
    });
    gridHtml += `</div>`;
  }

  app.innerHTML = filterHtml + gridHtml;

  app.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => { activeFilter = btn.dataset.filter; render(); });
  });
  app.querySelectorAll('.tile').forEach(tile => {
    tile.addEventListener('click', () => { viewingId = tile.dataset.id; currentView = "detail"; render(); window.scrollTo(0,0); });
  });
}

/* =========================================================
   DETALLE — página tipo case study
   ========================================================= */
function renderDetail(app) {
  const projects = loadProjects();
  const p = projects.find(x => x.id === viewingId);
  if (!p) { currentView = "home"; render(); return; }

  const dateLabel = p.date ? new Date(p.date + "T00:00:00").toLocaleDateString('es-ES', { year: 'numeric', month: 'long' }) : "";

  let html = `
    <div style="position:relative;">
      <button class="back-btn" id="backBtnDetail" style="position:fixed; top:calc(14px + env(safe-area-inset-top)); left:14px; z-index:20;">‹ Volver</button>
      <div class="case-hero">
        ${p.cover ? `<img src="${p.cover}" alt="">` : `<div class="case-hero-noimg">Sin imagen de portada</div>`}
      </div>
    </div>
    <div class="case-body">
      ${p.category ? `<div class="case-cat">${escapeHtml(p.category)}</div>` : ""}
      <div class="case-title serif">${escapeHtml(p.title)}</div>
      ${dateLabel ? `<div class="case-date">${dateLabel}</div>` : ""}
      ${p.description ? `<div class="case-desc">${escapeHtml(p.description)}</div>` : ""}
      ${p.techStack && p.techStack.length ? `<div class="tech-row">${p.techStack.map(t => `<span class="tech-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ""}
  `;

  if (p.mapUrl) {
    html += `
      <div class="case-section-title">Mapa interactivo</div>
      <div class="map-embed-wrap"><iframe src="${escapeAttr(toEmbedUrl(p.mapUrl))}" loading="lazy" allowfullscreen></iframe></div>
    `;
  }

  if (p.gallery && p.gallery.length) {
    html += `
      <div class="case-section-title">Galería</div>
      <div class="gallery-grid">${p.gallery.map(g => `<img src="${g}" alt="">`).join('')}</div>
    `;
  }

  if (p.pdfUrl) {
    html += `
      <div class="case-section-title">Documento</div>
      <a class="pdf-btn" href="${escapeAttr(p.pdfUrl)}" target="_blank" rel="noopener">📄 Abrir PDF del proyecto</a>
    `;
  }

  html += `
      ${isAdmin() ? `
      <div class="edit-row">
        <button class="secondary-btn" id="editProjBtn">Editar</button>
        <button class="danger-btn" id="deleteProjBtn">Eliminar</button>
      </div>` : ""}
    </div>
  `;

  app.innerHTML = html;

  document.getElementById('backBtnDetail').addEventListener('click', () => { currentView = "home"; render(); });
  const editBtn = document.getElementById('editProjBtn');
  const delBtn = document.getElementById('deleteProjBtn');
  if (editBtn) editBtn.addEventListener('click', () => { editingId = p.id; currentView = "form"; render(); });
  if (delBtn) delBtn.addEventListener('click', async () => {
    if (!confirm("¿Eliminar este proyecto? No se puede deshacer.")) return;
    const ok = await deleteProjectFromCloud(p.id);
    if (!ok) return;
    showToast("🗑️ Proyecto eliminado");
    currentView = "home";
    await fetchProjectsFromCloud();
    render();
  });
}

/* =========================================================
   FORMULARIO
   ========================================================= */
function renderForm(app) {
  const projects = loadProjects();
  const existing = editingId ? projects.find(p => p.id === editingId) : null;
  const data = existing || { title: "", category: "", date: "", description: "", techStack: [], cover: "", gallery: [], mapUrl: "", pdfUrl: "" };

  const categories = Array.from(new Set(projects.map(p => p.category).filter(Boolean)));

  app.innerHTML = `
    <div class="field">
      <label>Título del proyecto</label>
      <input type="text" id="fTitle" value="${escapeAttr(data.title)}" placeholder="Ej. NDVI vs temperatura en el Retiro">
    </div>
    <div class="field">
      <label>Categoría</label>
      <input type="text" id="fCategory" list="catList" value="${escapeAttr(data.category)}" placeholder="Ej. Teledetección, LiDAR, Solar...">
      <datalist id="catList">${categories.map(c => `<option value="${escapeAttr(c)}">`).join('')}</datalist>
    </div>
    <div class="field">
      <label>Fecha (aprox.)</label>
      <input type="date" id="fDate" value="${data.date || ''}">
    </div>
    <div class="field">
      <label>Explicación / metodología utilizada</label>
      <textarea id="fDesc" placeholder="Qué herramientas y proceso seguiste...">${escapeHtml(data.description)}</textarea>
    </div>
    <div class="field">
      <label>Tecnologías (separadas por comas)</label>
      <input type="text" id="fTech" value="${escapeAttr((data.techStack || []).join(', '))}" placeholder="QGIS, Python, LiDAR...">
    </div>

    <div class="field">
      <label>Ruta o URL de la foto de portada</label>
      <input type="text" id="fCover" value="${escapeAttr(data.cover)}" placeholder="images/mi-proyecto-portada.jpg">
      <img id="coverPreview" class="upload-preview" style="${data.cover ? '' : 'display:none;'}" src="${escapeAttr(data.cover || '')}">
    </div>

    <div class="field">
      <label>Rutas o URLs de fotos de galería (una por línea)</label>
      <textarea id="fGallery" placeholder="images/mi-proyecto-1.jpg&#10;images/mi-proyecto-2.jpg">${escapeHtml((data.gallery || []).join('\n'))}</textarea>
    </div>

    <div class="field">
      <label>Enlace del mapa interactivo (opcional)</label>
      <input type="url" id="fMapUrl" value="${escapeAttr(data.mapUrl)}" placeholder="https://...">
    </div>
    <div class="field">
      <label>Enlace al PDF (opcional)</label>
      <input type="url" id="fPdfUrl" value="${escapeAttr(data.pdfUrl)}" placeholder="https://...">
    </div>

    <button class="primary-btn" id="saveBtn">Guardar proyecto</button>
    ${existing ? `<button class="danger-btn" id="deleteBtn">Eliminar proyecto</button>` : ""}
  `;

  const coverInput = document.getElementById('fCover');
  coverInput.addEventListener('input', () => {
    const prev = document.getElementById('coverPreview');
    if (coverInput.value.trim()) { prev.src = coverInput.value.trim(); prev.style.display = "block"; }
    else { prev.style.display = "none"; }
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const title = document.getElementById('fTitle').value.trim();
    if (!title) { showToast("⚠️ Falta el título del proyecto"); return; }
    const record = {
      id: existing ? existing.id : uid(),
      title,
      category: document.getElementById('fCategory').value.trim(),
      date: document.getElementById('fDate').value || "",
      description: document.getElementById('fDesc').value.trim(),
      techStack: document.getElementById('fTech').value.split(',').map(s => s.trim()).filter(Boolean),
      cover: document.getElementById('fCover').value.trim(),
      gallery: document.getElementById('fGallery').value.split('\n').map(s => s.trim()).filter(Boolean),
      mapUrl: document.getElementById('fMapUrl').value.trim(),
      pdfUrl: document.getElementById('fPdfUrl').value.trim()
    };
    const ok = await saveProjectToCloud(record);
    if (!ok) return;
    showToast(existing ? "✅ Proyecto actualizado" : "✅ Proyecto añadido");
    viewingId = record.id;
    currentView = "detail"; editingId = null;
    await fetchProjectsFromCloud();
    render();
  });

  if (existing) {
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm("¿Eliminar este proyecto? No se puede deshacer.")) return;
      const ok = await deleteProjectFromCloud(existing.id);
      if (!ok) return;
      showToast("🗑️ Proyecto eliminado");
      currentView = "home"; editingId = null;
      await fetchProjectsFromCloud();
      render();
    });
  }
}

/* Init */
try {
  render();
  fetchProjectsFromCloud();
} catch (e) {
  console.error("Error al iniciar la app:", e);
  document.getElementById('app').innerHTML = `
    <div class="info-box">
      <p>⚠️ Hubo un problema al cargar tus datos guardados.</p>
      <p>Puedes intentar recargar, o si persiste, reiniciar solo los datos de la app (tus datos guardados en este dispositivo se borrarían).</p>
    </div>
    <button class="secondary-btn" onclick="location.reload()">Recargar</button>
    <button class="danger-btn" onclick="localStorage.clear(); location.reload();">Reiniciar datos de la app</button>
  `;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
